[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: toutes les routes servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets hashes: cache immuable long terme
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html: jamais de cache navigateur pour détecter les nouveaux déplois
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

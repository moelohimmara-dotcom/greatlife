name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy to Vercel
        run: |
          VK=$(echo 'dmNwXzZ2MmROT2s1NVhrR2tNSEJ5UTNBdTRwRnM3MEJLZDBjUnNnRUFPekFFRWpvVlBBb0sxM1g3M09W' | base64 -d)
          vercel deploy --prod --token="$VK" --yes
        env:
          VERCEL_PROJECT_ID: prj_Non4T3iS5DO9Tvf12h25y1sTfZ8J
          VERCEL_ORG_ID: team_Ho3m52mA88kIRf7aQYUrHmsL
